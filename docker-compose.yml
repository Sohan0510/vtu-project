services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vtu_backend
    ports:
      - "8000:8000"
    volumes:
      - ./exports:/app/exports
    environment:
      - MONGO_URI=${MONGO_URI}
      - TESSERACT_PATH=/usr/bin/tesseract
      - ADMIN_ID=${ADMIN_ID:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vtu_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

